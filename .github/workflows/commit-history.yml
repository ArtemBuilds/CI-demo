name: commit-history

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update commit history
        run: |
          rm -f commit-history.txt
          git log --date=iso-strict \
            --pretty=format:'%h | %ad | %an | %s' \
            > commit-history.txt

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update commit history
          file_pattern: commit-history.txt
